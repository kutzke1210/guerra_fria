<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOSSIÊ FROST SHADOW — ARQUIVO HISTÓRICO DE BERLIM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0D0D0D;
      color: #c0c0c0;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ========== BACKGROUND LAYERS ========== */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.003) 3px, rgba(255,255,255,0.003) 4px);
      background-size: 100% 3px, 4px 100%;
      opacity: 0.15;
    }

    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(214, 195, 165, 0.003) 24px, rgba(214, 195, 165, 0.003) 25px);
      background-size: 1px 25px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    #bg-grid::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgba(139, 30, 30, 0.06);
      transform: translateX(-50%);
      box-shadow: 0 0 20px rgba(139, 30, 30, 0.03);
    }

    /* ========== PRESENTATION ========== */
    #presentation {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #slides-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ========== SLIDES ========== */
    .slide {
      position: absolute;
      width: 80%;
      max-width: 960px;
      opacity: 0;
      transform: translateY(30px) scale(0.97);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
      padding: 2rem;
      background: rgba(13, 13, 13, 0.85);
      border: 1px solid rgba(63, 63, 63, 0.6);
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.2), transparent);
      opacity: 0.5;
    }

    /* staple marks top-left + top-right */
    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.2), transparent);
      opacity: 0.5;
    }

    .slide .staple-left,
    .slide .staple-right {
      position: absolute;
      top: 0.4rem;
      width: 12px;
      height: 5px;
      opacity: 0.06;
    }

    .slide .staple-left::before,
    .slide .staple-left::after,
    .slide .staple-right::before,
    .slide .staple-right::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 1px;
      background: #C9A227;
      transform-origin: center;
    }

    .slide .staple-left::before { left: 0; top: 0; transform: rotate(-25deg); }
    .slide .staple-left::after { left: 0; top: 4px; transform: rotate(25deg); }
    .slide .staple-right::before { right: 0; top: 0; transform: rotate(25deg); }
    .slide .staple-right::after { right: 0; top: 4px; transform: rotate(-25deg); }

    .slide .staple-left { left: 0.8rem; }
    .slide .staple-right { right: 0.8rem; }

    /* binder holes (left edge) */
    .slide::after {
      content: 'FS-' attr(data-id);
      position: absolute;
      top: 0.5rem;
      right: 0.8rem;
      font-size: 0.5rem;
      color: rgba(255,255,255,0.06);
      letter-spacing: 0.1em;
      font-family: 'Courier New', monospace;
    }

    .slide.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .slide.exit {
      opacity: 0;
      transform: translateY(-30px) scale(0.97);
    }

    .cover-content {
      text-align: left;
    }

    .cover-title {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 900;
      color: #C9A227;
      letter-spacing: 0.08em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 30px rgba(201, 162, 39, 0.3);
    }

    .cover-accent {
      width: 80px;
      height: 3px;
      background: #C9A227;
      margin-bottom: 2.5rem;
      box-shadow: 0 0 15px rgba(201, 162, 39, 0.4);
    }

    .cover-subtitle {
      font-size: clamp(0.85rem, 1.3vw, 1.1rem);
      color: #D6C3A5;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 1.2rem;
    }

    .cover-names {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 2rem;
    }

    .cover-names span {
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      color: #e0e0e0;
      font-weight: 500;
      position: relative;
      padding-left: 1rem;
    }

    .cover-names span::before {
      content: '>';
      position: absolute;
      left: 0;
      color: #C9A227;
      font-weight: 700;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .slide-number {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.1em;
    }

    .slide-label {
      font-size: 0.7rem;
      color: #C9A227;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 600;
    }

    .slide-title {
      font-size: clamp(1.3rem, 2.5vw, 1.9rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 0.8rem;
      position: relative;
      padding-bottom: 0.8rem;
    }

    .slide-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 3px;
      background: #C9A227;
      margin-top: 0.8rem;
      box-shadow: 0 0 10px rgba(201, 162, 39, 0.3);
    }

    .slide-content {
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      line-height: 1.8;
      color: #999;
      max-width: 900px;
      text-align: justify;
    }

    .slide-content strong {
      color: #C9A227;
      font-weight: 600;
    }

    .slide-layout {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .slide-text.has-image {
      flex: 1 1 60%;
      min-width: 0;
    }

    .slide-media {
      flex: 0 0 35%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-images {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .slide-images.multi {
      flex-direction: row;
      justify-content: center;
    }

    .slide-images.grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .slide-figure {
      margin: 0;
      border-radius: 4px;
      overflow: hidden;
      background: #0D0D0D;
      border: 1px solid #3F3F3F;
      transition: border-color 0.3s;
    }

    .slide-figure:hover {
      border-color: #C9A227;
    }

    .slide-figure img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: cover;
    }

    .slide-figure.multi img,
    .slide-figure.grid img {
      max-height: 160px;
    }

    .slide-figure figcaption {
      padding: 0.5rem 0.8rem;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .slide-layout { flex-direction: column; gap: 1rem; }
      .slide-text.has-image { flex: none; }
      .slide-media { flex: none; width: 100%; }
      .slide-figure img { max-height: 240px; }
      .slide-images.multi { flex-direction: column; align-items: center; }
      .slide-figure.multi { max-width: 240px; }
      .slide-images.grid { grid-template-columns: 1fr 1fr; }
      .slide-figure.grid img { max-height: 120px; }
    }

    /* ========== NAV BAR ========== */
    #nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1rem 2rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      z-index: 100;
    }

    #dots {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #222;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      padding: 0;
    }

    .dot:hover {
      background: #444;
    }

    .dot.active {
      background: transparent;
      border-color: #C9A227;
      width: 20px;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.2);
    }

    #counter {
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: center;
    }

    #hint {
      font-size: 0.65rem;
      color: #222;
      letter-spacing: 0.1em;
    }

    #click-left, #click-right {
      position: fixed;
      top: 0;
      bottom: 50px;
      width: 50%;
      z-index: 50;
      cursor: pointer;
    }
    #click-left { left: 0; }
    #click-right { right: 0; }

    /* ========== GAME SCREEN ========== */
    .game-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .game-screen > * {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes scanPulse { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.3; } }
    @keyframes glitch {
      0%, 100% { transform: translate(0); opacity: 1; }
      92% { transform: translate(0); opacity: 1; }
      93% { transform: translate(-3px, 2px); opacity: 0.85; }
      94% { transform: translate(3px, -1px); opacity: 0.9; }
      95% { transform: translate(-1px, 1px); opacity: 0.85; }
      96% { transform: translate(0); opacity: 1; }
    }
    @keyframes flashGreen {
      0% { background: rgba(201, 162, 39, 0.15); }
      100% { background: transparent; }
    }
    @keyframes flashRed {
      0% { background: rgba(139, 30, 30, 0.15); }
      100% { background: transparent; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }

    .glitch { animation: glitch 4s ease infinite; }

    /* ========== GERMAN STAMPS ========== */
    .stamp {
      display: inline-block;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 0.55rem;
      padding: 0.15rem 0.4rem;
      letter-spacing: 0.15em;
      transform: rotate(-4deg);
      opacity: 0.6;
      pointer-events: none;
    }

    .stamp-geheim {
      color: #8B1E1E;
      border: 2px solid #8B1E1E;
    }

    .stamp-vertraulich {
      color: #C9A227;
      border: 2px solid #C9A227;
    }

    .stamp-streng-geheim {
      color: #8B1E1E;
      border: 3px solid #8B1E1E;
      font-size: 0.6rem;
      padding: 0.2rem 0.5rem;
    }

    .stamp-top-secret {
      color: #D6C3A5;
      border: 2px solid #D6C3A5;
      font-size: 0.5rem;
    }

    /* ========== DOSSIER PANEL ========== */
    .dossier {
      background: rgba(13, 13, 13, 0.7);
      border: 1px solid rgba(63, 63, 63, 0.5);
      padding: 1.2rem;
      position: relative;
      width: 100%;
    }

    .dossier::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.15), transparent);
    }

    .dossier-header {
      font-size: 0.6rem;
      color: #555;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      display: flex;
      justify-content: space-between;
    }

    .dossier-ref {
      color: rgba(214, 195, 165, 0.4);
      font-size: 0.5rem;
    }


    /* ========== GAME INTRO — DOSSIER BRIEFING ========== */
    .game-intro-content { max-width: 700px; }

    .cia-logo {
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      border: 1px solid #3F3F3F;
      padding: 0.4rem 1rem;
      display: inline-block;
    }

    .cia-logo strong {
      color: #C9A227;
      font-weight: 700;
      letter-spacing: 0.4em;
    }

    .operation-code {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      color: #C9A227;
      letter-spacing: 0.15em;
      line-height: 1.2;
      margin: 1.2rem 0 0.5rem;
      text-shadow: 0 0 40px rgba(201, 162, 39, 0.25);
    }

    .operation-date {
      font-size: 0.85rem;
      color: #D6C3A5;
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
    }

    .operation-threat {
      font-size: 0.75rem;
      color: #8B1E1E;
      letter-spacing: 0.2em;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    .game-intro-divider {
      width: 60px;
      height: 2px;
      background: #C9A227;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 10px rgba(201, 162, 39, 0.3);
    }

    .game-intro-text {
      font-size: clamp(0.9rem, 1.4vw, 1.1rem);
      color: #999;
      line-height: 1.8;
      margin-bottom: 0.2rem;
      text-align: center;
    }

    .game-intro-text .highlight {
      color: #C9A227;
    }

    .game-intro-text .danger {
      color: #8B1E1E;
    }

    .intro-objective {
      margin: 1rem 0 0.5rem;
      padding: 0.8rem 1.2rem;
      border-left: 2px solid #C9A227;
      background: rgba(201, 162, 39, 0.03);
    }

    .intro-objective .obj-label {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .intro-objective .obj-text {
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 0.3rem;
      line-height: 1.5;
    }

    /* ========== BUTTONS ========== */
    .game-btn {
      margin-top: 2rem;
      padding: 0.9rem 2.2rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #C9A227;
      background: transparent;
      border: 1px solid #C9A227;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .game-btn:hover {
      background: rgba(201, 162, 39, 0.08);
      box-shadow: 0 0 25px rgba(201, 162, 39, 0.15), inset 0 0 25px rgba(201, 162, 39, 0.05);
    }

    .game-btn-secondary {
      border-color: #444;
      color: #666;
    }

    .game-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: #666;
      color: #888;
      box-shadow: none;
    }

    /* ========== DOCUMENT QUESTION ========== */
    .game-question-content { padding-top: 1.5rem; }

    .mission-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .mission-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #C9A227;
      letter-spacing: 0.2em;
    }

    .mission-number {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
    }

    .security-bar-container {
      width: 100%;
      margin-bottom: 0.8rem;
    }

    .security-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 0.1em;
      margin-bottom: 0.2rem;
    }

    .security-bar-track {
      width: 100%;
      height: 4px;
      background: #3F3F3F;
      border-radius: 2px;
      overflow: hidden;
    }

    .security-bar-fill {
      height: 100%;
      background: #C9A227;
      border-radius: 2px;
      transition: width 0.5s ease, background 0.5s ease;
    }

    .security-bar-fill.warning {
      background: #D6C3A5;
    }

    .security-bar-fill.critical {
      background: #8B1E1E;
    }

    .game-stats {
      display: flex;
      gap: 2.5rem;
      width: 100%;
      margin-bottom: 0.8rem;
      justify-content: center;
    }

    .game-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-obtained .stat-value { color: #C9A227; }
    .stat-leaked .stat-value { color: #8B1E1E; }

    .mission-progress {
      width: 100%;
      height: 2px;
      background: #3F3F3F;
      margin-bottom: 0.5rem;
    }

    .mission-progress-fill {
      height: 100%;
      background: #C9A227;
      transition: width 0.5s ease;
    }

    .game-question-box {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .game-context-box {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.6rem 0.8rem;
      border-left: 2px solid rgba(201, 162, 39, 0.3);
      background: rgba(201, 162, 39, 0.03);
    }

    .game-context-label {
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .game-context-text {
      font-size: 0.85rem;
      color: #999;
      line-height: 1.5;
      font-style: italic;
    }

    .game-question-text {
      font-size: clamp(0.95rem, 1.5vw, 1.15rem);
      color: #fff;
      line-height: 1.6;
      font-weight: 600;
    }

    .game-options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }

    .game-option {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.75rem 1rem;
      background: transparent;
      border: 1px solid #222;
      color: #aaa;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .game-option:hover:not(:disabled) {
      border-color: #C9A227;
      background: rgba(201, 162, 39, 0.03);
    }

    .game-option-letter {
      width: 28px;
      height: 28px;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #555;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .game-option:hover:not(:disabled) .game-option-letter {
      border-color: #C9A227;
      color: #C9A227;
    }

    .game-option-text {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .game-option.correct {
      border-color: #C9A227;
      background: rgba(201, 162, 39, 0.08);
    }

    .game-option.correct .game-option-letter {
      border-color: #C9A227;
      color: #C9A227;
      background: rgba(201, 162, 39, 0.12);
    }

    .game-option.wrong {
      border-color: #8B1E1E;
      background: rgba(139, 30, 30, 0.08);
    }

    .game-option.wrong .game-option-letter {
      border-color: #8B1E1E;
      color: #8B1E1E;
      background: rgba(139, 30, 30, 0.12);
    }

    .game-option:disabled {
      cursor: default;
    }

    /* ========== DOCUMENT RETRIEVAL ========== */
    .hacking-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .hacking-line {

    /* ========== PROTOCOLO FINAL BUTTON ========== */
    .protocolo-btn {

      font-family: inherit;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      animation: protPulse 1.5s ease-in-out infinite;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(139, 30, 30, 0.3), inset 0 0 20px rgba(139, 30, 30, 0.08);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      width: 100%;
      max-width: 300px;

    .protocolo-btn::before {
      content: '☢ ';
      font-size: 1rem;

    .protocolo-btn::after {
      content: '';

      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,0,0,0.05), transparent);
      animation: protSweep 2s ease-in-out infinite;

    .protocolo-btn:hover {

      box-shadow: 0 0 50px rgba(139, 30, 30, 0.6), inset 0 0 50px rgba(139, 30, 30, 0.2);
      border-color: #ff4444;
      color: #ff4444;
      transform: scale(1.05);

    .protocolo-btn:active {

      max-width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 30, 30, 0.2), transparent);
      margin: 1rem auto;

    @keyframes protPulse {
      0%, 100% { opacity: 0.8; box-shadow: 0 0 15px rgba(139, 30, 30, 0.2), inset 0 0 15px rgba(139, 30, 30, 0.05); }
      50% { opacity: 1; box-shadow: 0 0 35px rgba(139, 30, 30, 0.5), inset 0 0 35px rgba(139, 30, 30, 0.12); }
    }

    @keyframes protSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ========== PROTOCOLO OVERLAY ========== */
    #prot-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #prot-canvas {
      position: fixed;
      inset: 0;
      z-index: 20001;
      pointer-events: none;
    }

    #prot-flash {
      position: fixed;
      inset: 0;
      z-index: 20002;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;

    #prot-red-overlay {
      position: fixed;
      inset: 0;
      z-index: 19999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;

    #prot-red-overlay.pulsing {

    @keyframes protRedPulse {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.35; }
    }

    /* glitch overlay */
    #prot-glitch {
      position: fixed;
      inset: 0;
      z-index: 19998;
      pointer-events: none;
      opacity: 0;
    }

    #prot-glitch.active {
      animation: protGlitch 0.3s ease infinite;
    }

    @keyframes protGlitch {
      0%, 100% { opacity: 0; transform: translate(0); }
      4% { opacity: 1; transform: translate(-6px, 4px); clip-path: inset(0 0 85% 0); }
      6% { opacity: 1; transform: translate(6px, -3px); clip-path: inset(15% 0 70% 0); }
      8% { opacity: 1; transform: translate(-3px, 2px); clip-path: inset(40% 0 50% 0); }
      10% { opacity: 0; transform: translate(0); }
      20% { opacity: 1; transform: translate(4px, -5px); clip-path: inset(60% 0 30% 0); }
      22% { opacity: 0; transform: translate(0); }
      35% { opacity: 1; transform: translate(-5px, 2px); clip-path: inset(25% 0 60% 0); }
      37% { opacity: 0; transform: translate(0); }
      50% { opacity: 1; transform: translate(3px, -4px); clip-path: inset(10% 0 80% 0); }
      52% { opacity: 0; transform: translate(0); }
    }

    /* scanlines overlay */
    #prot-scanlines {
      position: fixed;
      inset: 0;
      z-index: 19997;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px

    /* alert line styles */
    .prot-alert-line {
      font-family: 'Courier New', monospace;
      letter-spacing: 0.2em;
      text-align: center;
      opacity: 0;
      margin: 0.4rem 0;
    }

    .prot-alert-line.shake {
      animation: protAlertShake 0.15s ease 3;
    }

    @keyframes protAlertShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* glitch text effect for alert lines */
    .prot-alert-line.glitch-text {
      animation: protTextGlitch 0.6s ease 1;
    }

    @keyframes protTextGlitch {
      0%, 90%, 100% { opacity: 1; }
      92% { opacity: 0.3; transform: translateX(-4px); }
      94% { opacity: 1; transform: translateX(2px); }
      96% { opacity: 0.5; transform: translateX(-1px); }

    #prot-counter {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      color: #ff2222;
      text-align: center;
      opacity: 0;
      margin-top: 1.5rem;

      text-shadow: 0 0 80px rgba(255, 0, 0, 0.8), 0 0 160px rgba(255, 0, 0, 0.4);

    .prot-reveal-line {
      font-family: 'Courier New', monospace;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.2s ease, transform 1.2s ease;

    #prot-dust {
      position: fixed;
      inset: 0;
      z-index: 20003;
